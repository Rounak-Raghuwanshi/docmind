; Runs the API and the ARQ worker in one container (free hosting gives us one).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s --proxy-headers --forwarded-allow-ips="*" --timeout-graceful-shutdown 20
autorestart=true
stopsignal=TERM
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=arq app.workers.settings.WorkerSettings
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
