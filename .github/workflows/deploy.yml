# Deploys the backend to a Hugging Face Docker Space after CI passes on main.
# The frontend deploys itself: Vercel watches the repo (Root Directory: frontend).
#
# Repository settings → Secrets and variables → Actions:
#   secret   HF_TOKEN   a Hugging Face token with write access
#   variable HF_SPACE   e.g. your-username/docmind-api
name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Push backend/ to the Space (HF builds the Dockerfile)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" && test -n "$HF_SPACE" || { echo "Set HF_TOKEN and HF_SPACE"; exit 1; }
          HF_USER="${HF_SPACE%%/*}"
          git clone "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space
          rsync -a --delete --exclude .git --exclude tests --exclude .venv --exclude storage backend/ space/
          cp deploy/hf-space-README.md space/README.md
          cd space
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No backend changes"; exit 0; fi
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push
      - name: Wait for the new build to come up
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          URL="https://$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]').hf.space/api/ready"
          for i in $(seq 1 60); do
            if curl -fsS "$URL" >/dev/null; then echo "Healthy: $URL"; exit 0; fi
            sleep 20
          done
          echo "Space did not become ready in time: $URL"; exit 1
