<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ask questions across your documents and get answers with clickable, page-level citations." />
    <meta name="theme-color" content="#4f46e5" />
    <title>DocMind — answers from your documents, with citations</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = JSON.parse(localStorage.getItem("docmind-ui") || "{}")?.state?.theme;
        const dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
