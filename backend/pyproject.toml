[project]
name = "docmind"
version = "1.0.0"
description = "Multi-tenant RAG document assistant with streamed, cited answers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "pymupdf>=1.25",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "python-docx>=1.1",
    "fastembed>=0.4.2",
    "numpy>=1.26",
    "openai>=1.57",
    "boto3>=1.35",
    "sentry-sdk[fastapi]>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[s3]",
    "types-pytz",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S105",   # false positives on token-type string constants
    "S311",   # random is not used for security
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012",
    "RUF001",  # "›" in chunk context strings is intentional
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "E501"]
"scripts/**" = ["S"]
"app/rag/prompts.py" = ["E501"]  # prompt text reads better unwrapped
"app/cli.py" = ["ASYNC"]
"app/seed/*.py" = ["E501"]  # demo content and scripted answers are prose  # one-off command; blocking file reads are fine

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres (pgvector) and Redis"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy's async layer runs code in greenlets
omit = ["app/workers/settings.py", "app/cli.py"]
